@if (ready()) {
  <nav mat-tab-nav-bar [tabPanel]="panel" aria-label="Relocation">
    @for (tab of tabs(); track tab.label) {
      <a
        #current="routerLinkActive"
        mat-tab-link
        routerLinkActive
        [routerLink]="tab.commands"
        [routerLinkActiveOptions]="{ exact: true }"
        [active]="current.isActive"
        >{{ tab.label }}</a
      >
    }
  </nav>
}
<mat-tab-nav-panel #panel>
  <ng-content />
</mat-tab-nav-panel>
