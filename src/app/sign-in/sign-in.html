<section class="sign-in">
  <h1 class="page-title">Sign in</h1>
  <p class="page-lead">
    Plan a move in one place: the checklist, the budget, the documents, and the dates.
  </p>
  @if (errorMessage(); as message) {
    <p class="error" role="alert">{{ message }}</p>
  }
  <a matButton="filled" [href]="signInUrl">Continue with Google</a>
</section>
