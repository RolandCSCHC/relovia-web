<div class="shell">
  <header class="topbar">
    <a class="wordmark" routerLink="/" aria-label="Relovia">
      <svg viewBox="0 0 220 44" aria-hidden="true">
        <image href="logo-icon.png" x="-20.3" y="-17" width="73.6" height="73.6" />
        <text
          x="46"
          y="39"
          font-family="Arial, Helvetica, sans-serif"
          font-size="48"
          font-weight="700"
          letter-spacing="-1.5"
          fill="currentColor"
        >
          Relovia
        </text>
      </svg>
    </a>
    <span class="spacer"></span>
    @if (session.user(); as user) {
      <a matButton routerLink="/notifications" [attr.aria-label]="notificationsLabel()">
        Notifications
        @if (unreadCount() > 0) {
          <span class="unread">{{ unreadCount() }}</span>
        }
      </a>
      <span class="user">{{ user.displayName }}</span>
      <button matButton type="button" (click)="signOut()">Sign out</button>
    }
    <button
      matIconButton
      type="button"
      (click)="theme.toggle()"
      [attr.aria-label]="themeToggleLabel()"
    >
      <mat-icon>{{ themeIcon() }}</mat-icon>
    </button>
  </header>
  <main class="page">
    <router-outlet />
  </main>
</div>
