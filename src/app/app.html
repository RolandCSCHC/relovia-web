<div class="shell">
  <header class="topbar">
    <a class="wordmark" routerLink="/">Relovia</a>
    <span class="spacer"></span>
    @if (session.user(); as user) {
      <span class="user">{{ user.displayName }}</span>
      <button matButton type="button" (click)="signOut()">Sign out</button>
    }
    <button
      matIconButton
      type="button"
      (click)="theme.toggle()"
      [attr.aria-label]="themeToggleLabel()"
    >
      <mat-icon>{{ themeIcon() }}</mat-icon>
    </button>
  </header>
  <main class="page">
    <router-outlet />
  </main>
</div>
