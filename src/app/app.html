<mat-toolbar>
  <span class="brand">Relovia</span>
  <span class="spacer"></span>
  @if (session.user(); as user) {
    <span class="user">{{ user.displayName }}</span>
    <button matButton type="button" (click)="signOut()">Sign out</button>
  }
  <button
    matIconButton
    type="button"
    (click)="theme.toggle()"
    [attr.aria-label]="themeToggleLabel()"
  >
    <mat-icon>{{ themeIcon() }}</mat-icon>
  </button>
</mat-toolbar>
<main>
  <router-outlet />
</main>
